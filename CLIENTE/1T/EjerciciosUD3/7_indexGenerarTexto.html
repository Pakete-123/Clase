<!-- 
La forma más sencilla de añadir texto y elementos de forma dinámica a una página
HTML es mediante el uso del método write de window.document 
-->


<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Escribir en otra ventana</title>
</head>

<body>
    <script>
        var texto = prompt("Título ventana");
        var ventanaNueva = window.open();
        ventanaNueva.document.write("<h1>" + texto + "<h1>");
    </script>
</body>

</html>
