<!DOCTYPE html>
<html lang="es">

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>
    <script>
        document.write('Valores de las propiedades del objeto screen:<br>');
        document.write('availHeight :' + screen.availHeight + '<br>'); //Tiene en cuenta la barra de tareas
        document.write('availWidth :' + screen.availWidth + '<br>');
        document.write('height :' + screen.height + '<br>'); //NO tiene en cuenta la barra de tareas
        document.write('width :' + screen.width + '<br>');
        document.write('colorDepth :' + screen.colorDepth + '<br>');
        document.write('pixelDepth :' + screen.pixelDepth);
    </script>
</body>

</html>

<!-- Ejercicio: Busca información sobre las diferentes propiedades de este objeto. -->
