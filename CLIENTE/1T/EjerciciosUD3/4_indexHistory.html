<!-- 
 
El objeto history almacena todas las páginas que visitamos. Luego, con una serie de
funciones, podemos extraer de la memoria del ordenador las páginas ya visitadas, sin
tener que pedirlas nuevamente al servidor.
Cuenta con las siguientes funciones:
 
 window.history.back(); Retrocede a la página anterior
 
 window.history.forward(); Avanza a la página siguiente almacenada en la caché de la máquina.
 
 window.history.go(); Avanza o retrocede en la lista de páginas visitadas.

 Llamar a la función back, tiene el mismo comportamiento que presionar el botón Atrás del navegador.

-->
