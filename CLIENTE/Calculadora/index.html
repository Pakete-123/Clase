<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <title>Calculadora</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <script src='main.js' defer></script>
    </head>
    <body>
        <h1>Calculadora</h1>

        <form id="form">

            <label for="n1">Nº1</label>
            <input type="number" name="n1" id="n1"><br>

            <label for="op">Operación</label>
            <select name="op" id="op">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select><br>

            <label for="n2">Nº2</label>
            <input type="number" name="n2" id="n2"><br>

            <label for="dec">Introduzca cuantos decimales quiere: </label>
            <input type="number" id="dec" min="0" placeholder="Vacío: 0">

            <button id="btn">Calcular</button><br>
        </form>
        <h1 for="res" id="res">0</h1>
    </body>
</html>
